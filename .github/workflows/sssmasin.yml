name: AA_Testcc_Win 11
on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-2022
    timeout-minutes: 360          # حد GitHub الأقصى لأي job هو 360 دقيقة
    defaults:
      run:
        shell: pwsh
    env:
      # ===================== عدّل هذه القيم فقط =====================
      TS_AUTHKEY: "tskey-auth-PUT_YOUR_KEY_HERE"   # مفتاح Tailscale (يُفضّل Reusable + Ephemeral)
      aa2: "PUT_WINDOWS_USERNAME"                  # اسم مستخدم ويندوز الجديد
      aa3: "PUT_STRONG_PASSWORD_12CHARS"           # كلمة سر ويندوز + RustDesk (12 حرف أو أكثر، بلا مسافات)
      TIME_JOB: "330"                              # مدة الجلسة بالدقائق (لا تتجاوز 340)
      LINKS_LIST_URL: "https://tinyurl.com/ddaS441581"   # رابط حزمة NST/BitBrowser/NoMachine
      KEY_CHOICE: "1"                              # احتياطي: يُستخدم key1.txt من الحزمة لو TS_AUTHKEY فارغ
      # ==============================================================

    steps:
      # 0. فحص القيم قبل البدء
      - name: Validate settings
        run: |
          if ($env:aa3.Length -lt 12 -or $env:aa3 -match '\s') { throw 'aa3 must be at least 12 chars with no spaces.' }
          if ($env:aa2 -like 'PUT_*') { throw 'Edit aa2 (username) in the env block.' }
          if ($env:TS_AUTHKEY -like '*PUT_YOUR_KEY*') { Write-Warning 'TS_AUTHKEY not set; will try key file from the bundle.' }
          Write-Host "::add-mask::$env:aa3"
          Write-Host "::add-mask::$env:TS_AUTHKEY"

      # 1. إعداد النظام والمستخدمين والدقة
      - name: System, RDP & Display Setup
        continue-on-error: true
        run: |
          Write-Host "==== 1. CONFIGURING RDP, USERS & DISPLAY ===="
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0 -Force
          netsh advfirewall firewall set rule group="Remote Desktop" new enable=Yes

          $Secure = ConvertTo-SecureString $env:aa3 -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Secure
          if (-not (Get-LocalUser -Name $env:aa2 -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $env:aa2 -Password $Secure -AccountNeverExpires | Out-Null
              Add-LocalGroupMember Administrators $env:aa2
              Add-LocalGroupMember "Remote Desktop Users" $env:aa2
          }

          Write-Host "Setting Display Resolution to 1600x1200..."
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Sequential)]
          public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
              public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;
              public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight; public int dmDisplayFlags; public int dmDisplayFrequency;
          }
          public class UserUtils {
              [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);
          }
          "@
          $devMode = New-Object DEVMODE
          $devMode.dmSize = [System.Runtime.InteropServices.Marshal]::SizeOf($devMode)
          $devMode.dmPelsWidth = 1600
          $devMode.dmPelsHeight = 1200
          $devMode.dmFields = 0x100000 -bor 0x80000
          [UserUtils]::ChangeDisplaySettings([ref]$devMode, 0) | Out-Null
          Write-Host "Display Resolution Updated."

      # 2. تحميل الحزمة (مع تسجيل واضح لأي فشل)
      - name: Download & Extract App Bundle
        continue-on-error: true
        run: |
          Write-Host "==== 2. DOWNLOADING APP BUNDLE ===="
          $TempDir = Join-Path $env:TEMP 'AppBundle'
          New-Item -Path $TempDir -ItemType Directory -Force | Out-Null
          $BundleZip = Join-Path $env:TEMP 'app_bundle.zip'
          $LinksText = Invoke-RestMethod -Uri $env:LINKS_LIST_URL
          $Urls = $LinksText -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -match "^http" }
          Write-Host "Found $($Urls.Count) bundle link(s)."
          $Success = $false
          foreach ($Url in $Urls) {
              try {
                  Write-Host "Trying Bundle Link: $Url"
                  Invoke-WebRequest -Uri $Url -OutFile $BundleZip -UseBasicParsing -ErrorAction Stop -TimeoutSec 180
                  Expand-Archive -Path $BundleZip -DestinationPath $TempDir -Force -ErrorAction Stop
                  $Success = $true; break
              } catch {
                  Write-Warning "Link failed: $($_.Exception.Message)"
                  if (Test-Path $BundleZip) { Remove-Item $BundleZip -Force }
              }
          }
          if (-not $Success) { Write-Warning "BUNDLE NOT DOWNLOADED - NST/BitBrowser/NoMachine will be skipped." }
          else { Get-ChildItem $TempDir -Recurse -File | Select-Object -ExpandProperty Name | ForEach-Object { Write-Host " - $_" } }

      # 3. RustDesk (من الإصدار الرسمي) + ضبط الاتصال المباشر على المنفذ 21118
      - name: RustDesk Configuration
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:TEMP 'rustdesk-setup.exe'
          $rdUrl = 'https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-x86_64.exe'
          Invoke-WebRequest $rdUrl -OutFile $exe -UseBasicParsing
          Write-Host "Installing RustDesk 1.5.1"
          Start-Process $exe -ArgumentList '--silent-install' | Out-Null
          $rd = Join-Path $env:ProgramFiles 'RustDesk\rustdesk.exe'
          for ($i=0; $i -lt 48; $i++) {
              if ((Test-Path $rd) -and (Get-Service RustDesk -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Seconds 5
          }
          if (-not (Test-Path $rd) -or -not (Get-Service RustDesk -ErrorAction SilentlyContinue)) { throw 'RustDesk did not install.' }

          function Invoke-RustDeskCli {
              param([Parameter(Mandatory=$true)][string[]]$Arguments)
              $s = New-Object System.Diagnostics.ProcessStartInfo
              $s.FileName = $rd; $s.UseShellExecute = $false; $s.CreateNoWindow = $true
              $s.RedirectStandardOutput = $true; $s.RedirectStandardError = $true
              foreach ($a in $Arguments) { [void]$s.ArgumentList.Add($a) }
              $p = New-Object System.Diagnostics.Process; $p.StartInfo = $s
              try {
                  [void]$p.Start()
                  $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
                  if (-not $p.WaitForExit(20000)) { $p.Kill($true); throw 'RustDesk CLI timed out.' }
                  $out = $o.GetAwaiter().GetResult(); $err = $e.GetAwaiter().GetResult()
                  if ($p.ExitCode -ne 0) { throw "RustDesk CLI exit code $($p.ExitCode)." }
                  if (($out+$err) -match 'Installation and administrative privileges required|Settings are disabled|Failed to') { throw 'RustDesk CLI reported an error.' }
                  return $out.Trim()
              } finally { $p.Dispose() }
          }
          function Wait-DirectListener([int]$Seconds=35) {
              $deadline = (Get-Date).AddSeconds($Seconds)
              do {
                  foreach ($l in @(Get-NetTCPConnection -LocalPort 21118 -State Listen -ErrorAction SilentlyContinue)) {
                      $owner = Get-Process -Id $l.OwningProcess -ErrorAction SilentlyContinue
                      if ($owner.ProcessName -eq 'rustdesk') { return $true }
                  }
                  Start-Sleep -Seconds 2
              } while ((Get-Date) -lt $deadline)
              return $false
          }

          # اسمح بالمنفذ 21118 لشبكة Tailscale فقط
          Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'RustDesk' } | Disable-NetFirewallRule
          Get-NetFirewallRule -DisplayName 'RustDesk Tailnet Only' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RustDesk Tailnet Only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 21118 -RemoteAddress '100.64.0.0/10' -Program $rd -Profile Any | Out-Null

          $settings = [ordered]@{
              'custom-rendezvous-server' = '127.0.0.1'
              'stop-service'             = 'N'
              'approve-mode'             = 'password'
              'verification-method'      = 'use-permanent-password'
              'direct-access-port'       = '21118'
              'direct-server'            = 'Y'
          }
          $ready = $false
          for ($attempt=1; $attempt -le 3; $attempt++) {
              Write-Host "RustDesk configuration attempt $attempt/3"
              try {
                  if ((Get-Service RustDesk).Status -ne 'Running') { Start-Service RustDesk }
                  $worker = $false
                  for ($i=0; $i -lt 20; $i++) {
                      if (Get-CimInstance Win32_Process -Filter "Name='rustdesk.exe'" | Where-Object { $_.CommandLine -match '(?:^|\s)--server(?:\s|$)' }) { $worker = $true; break }
                      Start-Sleep -Seconds 3
                  }
                  if (-not $worker) { throw 'RustDesk --server worker missing.' }
                  foreach ($kv in $settings.GetEnumerator()) {
                      $null = Invoke-RustDeskCli @('--option', $kv.Key, $kv.Value)
                      Start-Sleep -Milliseconds 500
                      if ((Invoke-RustDeskCli @('--option', $kv.Key)) -ne $kv.Value) { throw "Option $($kv.Key) not confirmed." }
                      Write-Host "Verified option: $($kv.Key)"
                  }
                  $r = Invoke-RustDeskCli @('--password', $env:aa3)
                  if ($r -notmatch '(?im)^Done!\s*$') { throw 'RustDesk did not acknowledge the password.' }
                  if (-not (Wait-DirectListener 35)) { throw 'Listener not started.' }
                  Restart-Service RustDesk -Force
                  Start-Sleep -Seconds 5
                  if (-not (Wait-DirectListener 45)) { throw 'Listener did not return after restart.' }
                  foreach ($kv in $settings.GetEnumerator()) {
                      if ((Invoke-RustDeskCli @('--option', $kv.Key)) -ne $kv.Value) { throw "Option $($kv.Key) did not persist." }
                  }
                  $ready = $true; break
              } catch {
                  Write-Warning $_.Exception.Message
                  if ($attempt -lt 3) {
                      Stop-Service RustDesk -Force -ErrorAction SilentlyContinue
                      Get-Process rustdesk -ErrorAction SilentlyContinue | Stop-Process -Force
                      Start-Sleep -Seconds 2; Start-Service RustDesk; Start-Sleep -Seconds 5
                  }
              }
          }
          if (-not $ready) { throw 'RustDesk direct access was not verified.' }
          Write-Host "RustDesk direct-access listener is ready."

      # 4. Tailscale + طباعة بيانات الاتصال
      - name: Tailscale Setup
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          choco install tailscale -y --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0,1641,3010)) { throw "Tailscale install failed ($LASTEXITCODE)" }
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $ts)) { throw 'tailscale.exe missing.' }

          $key = $env:TS_AUTHKEY
          if ([string]::IsNullOrWhiteSpace($key) -or $key -like '*PUT_YOUR_KEY*') {
              # احتياطي: المفتاح من ملف الحزمة (base64)
              $kf = Get-ChildItem (Join-Path $env:TEMP 'AppBundle') -Filter "key$($env:KEY_CHOICE).txt" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $kf) { throw 'No Tailscale key: set TS_AUTHKEY or provide key file in the bundle.' }
              $key = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content $kf.FullName -Raw).Trim())).Trim()
          }
          Write-Host "::add-mask::$key"

          & $ts up "--authkey=$key" --accept-dns=false "--hostname=RDP-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Tailscale auth failed. Key expired/used? Create a new Reusable key.' }

          $ip = ''
          for ($i=0; $i -lt 20; $i++) {
              $ip = ((& $ts ip -4) | Select-Object -First 1)
              if ($ip -match '^100\.\d+\.\d+\.\d+$') { break }
              Start-Sleep -Seconds 3
          }
          if ($ip -notmatch '^100\.\d+\.\d+\.\d+$') { throw 'No Tailscale IPv4 assigned.' }
          "TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # RDP عبر Tailscale فقط
          Get-NetFirewallRule -DisplayName 'RDP Tailnet Only' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RDP Tailnet Only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          $info = @"
          ==============================
          Tailscale IP     : $ip
          RustDesk (Direct): ${ip}:21118   (Password = aa3)
          RDP              : ${ip}:3389    User: $($env:aa2) or runneradmin  (Password = aa3)
          ==============================
          "@
          Write-Host $info
          $info | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # 5. ملفات سطح المكتب
      - name: Deploy Important Files to Desktop
        continue-on-error: true
        run: |
          $BundleDir = Join-Path $env:TEMP 'AppBundle'
          $DesktopPath = Join-Path $env:USERPROFILE 'Desktop'
          function Download-And-Verify($TxtFile, $DestPath) {
              if (Test-Path $TxtFile) {
                  $Urls = Get-Content $TxtFile | ForEach-Object { $_.Trim() } | Where-Object { $_ -match "^http" }
                  $TempZip = Join-Path $env:TEMP "verify_$(Get-Random).zip"
                  foreach ($Url in $Urls) {
                      try {
                          Invoke-WebRequest -Uri $Url -OutFile $TempZip -UseBasicParsing -ErrorAction Stop -TimeoutSec 120
                          New-Item -Path $DestPath -ItemType Directory -Force | Out-Null
                          Expand-Archive -Path $TempZip -DestinationPath $DestPath -Force -ErrorAction Stop
                          Remove-Item $TempZip -Force
                          return $true
                      } catch { Write-Warning "Failed: $Url"; if (Test-Path $TempZip) { Remove-Item $TempZip -Force } }
                  }
              }
              return $false
          }
          $File1 = Get-ChildItem -Path $BundleDir -Filter "Link ZIP_URL.txt" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($File1) {
              $DesktopExtract = Join-Path $env:TEMP 'DesktopFiles'
              if (Download-And-Verify $File1.FullName $DesktopExtract) {
                  Get-ChildItem -Path $DesktopExtract -Recurse -File | ForEach-Object { Move-Item $_.FullName $DesktopPath -Force -ErrorAction SilentlyContinue }
              }
          }
          $File2 = Get-ChildItem -Path $BundleDir -Filter "*THREE_ZIP_URL*.txt" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($File2) {
              $ThreeDir = Join-Path $env:TEMP 'THREE_EXTRACTED'
              Download-And-Verify $File2.FullName $ThreeDir | Out-Null
          }

      # 6. المتصفحات والكيرنل
      - name: Browser & Kernel Setup
        continue-on-error: true
        run: |
          $BundleDir = Join-Path $env:TEMP 'AppBundle'
          $ThreeDir = Join-Path $env:TEMP 'THREE_EXTRACTED'

          $NstInst = Get-ChildItem -Path $BundleDir -Filter "*nst*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($NstInst) {
              Write-Host "Starting NST Browser installation with UI automation..."
              Start-Process -FilePath $NstInst.FullName
              Start-Sleep -Seconds 5
              $wshell = New-Object -ComObject WScript.Shell
              if ($wshell.AppActivate("Installer Language")) {
                  $wshell.SendKeys("{ENTER}"); Start-Sleep -Seconds 3
              }
              if ($wshell.AppActivate("Nstbrowser Setup")) {
                  $wshell.SendKeys("{ENTER}"); Start-Sleep -Seconds 2
                  $wshell.SendKeys("{ENTER}"); Start-Sleep -Seconds 15
                  $wshell.SendKeys("{ENTER}")
              }
              Write-Host "NST Browser installation completed."
              $NstK = Get-ChildItem -Path $ThreeDir -Filter "nstchrome.zip" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($NstK) {
                  $NstDest = "C:\Users\runneradmin\.nst-agent\download\kernels\nstchrome"
                  New-Item -ItemType Directory -Path $NstDest -Force | Out-Null
                  Expand-Archive -Path $NstK.FullName -DestinationPath $NstDest -Force
              }
          }

          $BitInst = Get-ChildItem -Path $BundleDir -Filter "*BitBrowser*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($BitInst) {
              Start-Process -FilePath $BitInst.FullName -ArgumentList "/S", "/allusers", "/norestart" -Wait
              $BitK = Get-ChildItem -Path $ThreeDir -Filter "bitchrom.zip" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($BitK) {
                  $BitDest = "C:\Users\runneradmin\AppData\Roaming\BitBrowser\Chrome-bin"
                  New-Item -ItemType Directory -Path $BitDest -Force | Out-Null
                  Expand-Archive -Path $BitK.FullName -DestinationPath $BitDest -Force
              }
          }

      # 7. NoMachine
      - name: Install NoMachine
        continue-on-error: true
        run: |
          $NmInstaller = Get-ChildItem -Path (Join-Path $env:TEMP 'AppBundle') -Filter "*nomachine*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($NmInstaller) { Start-Process -FilePath $NmInstaller.FullName -ArgumentList "/VERYSILENT", "/NORESTART" -Wait }
          else { Write-Warning "NoMachine installer not found in bundle." }

      # 8. العدّاد (بدون نوافذ منبثقة قد تعلّق الخطوة؛ التنبيهات تُكتب في السجل)
      - name: Keep Session Alive
        run: |
          Write-Host "==== SETUP COMPLETED. STARTING TIMER ===="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP | RustDesk: $env:TAILSCALE_IP`:21118 | RDP: $env:TAILSCALE_IP`:3389"
          $end = (Get-Date).AddMinutes([int]$env:TIME_JOB)
          $alerted = @(60, 30, 15, 5)
          while ((Get-Date) -lt $end) {
              $remaining = [math]::Ceiling(($end - (Get-Date)).TotalMinutes)
              if ($remaining -in $alerted) {
                  Write-Host "Session is running. $remaining minutes remaining."
                  $alerted = $alerted | Where-Object { $_ -ne $remaining }
              }
              Start-Sleep -Seconds 10
          }
          $StopFile = "C:\stop11stop.txt"
          if (Test-Path $StopFile) {
              Write-Host "File [$StopFile] FOUND. Waiting for GitHub forced timeout..."
              while ($true) { Start-Sleep -Seconds 3600 }
          } else {
              Write-Host "File [$StopFile] NOT found. Closing now."
          }

      - name: Cleanup
        if: always()
        run: |
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (Test-Path $ts) { & $ts logout }
          exit 0
